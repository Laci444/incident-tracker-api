---
info:
  name: 04 Swagger UI Relaxed CSP Header
  type: http
  seq: 4

http:
  method: GET
  url: "{{baseUrl}}/schema/swagger"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: 200
    - expression: res.headers['content-security-policy']
      operator: contains
      value: "script-src 'self' 'unsafe-inline'"
