info:
  name: 01 Entry Point GET (HATEOAS Discovery)
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/api"
  headers:
    - name: Accept
      value: application/hal+json

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: 200
    - expression: res.headers['content-type']
      operator: contains
      value: application/hal+json
    - expression: res.headers['cache-control']
      operator: contains
      value: max-age=60
    - expression: res.headers['etag']
      operator: isDefined
    - expression: res.headers['link']
      operator: contains
      value: rel="services"
    - expression: res.headers['content-security-policy']
      operator: contains
      value: "default-src 'none'"
    - expression: res.body.rmm_level
      operator: eq
      value: 3
    - expression: res.body._links.self.href
      operator: eq
      value: /api
    - expression: res.body._links.services.href
      operator: eq
      value: /api/services
    - expression: res.body._links.incidents.href
      operator: eq
      value: /api/incidents
