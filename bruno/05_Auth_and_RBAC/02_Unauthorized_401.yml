---
info:
  name: 02 Missing Credentials (401 Unauthorized)
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/api/me"
  headers:
    - name: Accept
      value: application/hal+json

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: 401
    - expression: res.headers['www-authenticate']
      operator: contains
      value: Basic realm=
    - expression: res.headers['content-type']
      operator: contains
      value: application/problem+json
    - expression: res.body.status
      operator: eq
      value: 401
