---
info:
  name: 01 Content Negotiation - HAL+JSON
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/api/services/1"
  headers:
    - name: Accept
      value: application/hal+json

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: 200
    - expression: res.headers['content-type']
      operator: contains
      value: application/hal+json
    - expression: res.body.slug
      operator: eq
      value: identity-auth-gateway
