---
info:
  name: 02 Content Negotiation - XML Representation
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/api/services/1"
  headers:
    - name: Accept
      value: application/xml

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: 200
    - expression: res.headers['content-type']
      operator: contains
      value: application/xml
