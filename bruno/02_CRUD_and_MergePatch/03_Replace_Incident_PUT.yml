---
info:
  name: 03 Replace Incident PUT (Full Representation Replacement)
  type: http
  seq: 3

http:
  method: PUT
  url: "{{baseUrl}}/api/v1/incidents/{{createdIncidentId}}"
  headers:
    - name: Accept
      value: application/hal+json
    - name: Content-Type
      value: application/json
  auth:
    type: basic
    username: dev_alice
    password: alice123
  body:
    type: json
    data: |
      {
        "service_id": 1,
        "release_id": 2,
        "title": "Elevated latency on token introspection (Resolved)",
        "summary": "Root cause identified as connection pool limit.",
        "severity": "medium",
        "status": "resolved",
        "resolution_notes": "Permanent fix deployed in v2.4.1."
      }

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: 200
    - expression: res.body.status
      operator: eq
      value: resolved
    - expression: res.body.release_id
      operator: eq
      value: 2
    - expression: res.body.severity
      operator: eq
      value: medium
