---
info:
  name: 03 Conditional GET with If-Modified-Since (304 Not Modified)
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/api/services/1"
  headers:
    - name: Accept
      value: application/hal+json
    - name: If-Modified-Since
      value: "{{serviceLastModified}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: 304
