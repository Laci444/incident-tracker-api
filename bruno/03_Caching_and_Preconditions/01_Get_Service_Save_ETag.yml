---
info:
  name: 01 Get Service and Save ETag / Last-Modified
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/api/v1/services/1"
  headers:
    - name: Accept
      value: application/hal+json

runtime:
  scripts:
    - type: after-response
      code: |
        bru.setEnvVar("serviceEtag", res.headers["etag"]);
        bru.setEnvVar("serviceLastModified", res.headers["last-modified"]);
  assertions:
    - expression: res.status
      operator: eq
      value: 200
    - expression: res.headers['etag']
      operator: isDefined
    - expression: res.headers['last-modified']
      operator: isDefined
    - expression: res.headers['cache-control']
      operator: contains
      value: max-age=60
