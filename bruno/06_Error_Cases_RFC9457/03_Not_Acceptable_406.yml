---
info:
  name: 03 Unsupported Accept Header (406 Not Acceptable)
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/api/v1/services"
  headers:
    - name: Accept
      value: text/csv

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: 406
    - expression: res.headers['content-type']
      operator: contains
      value: application/problem+json
    - expression: res.body.status
      operator: eq
      value: 406
    - expression: res.body.title
      operator: eq
      value: Not Acceptable
