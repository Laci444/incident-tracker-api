---
info:
  name: 01 Resource Not Found (404 application/problem+json)
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/api/v1/services/99999"
  headers:
    - name: Accept
      value: application/hal+json

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: 404
    - expression: res.headers['content-type']
      operator: contains
      value: application/problem+json
    - expression: res.body.status
      operator: eq
      value: 404
    - expression: res.body.title
      operator: eq
      value: Resource Not Found
    - expression: res.body.instance
      operator: eq
      value: /api/v1/services/99999
