[changelog]
header = ""
body = """
{% if version %}\
    ## What's Changed in {{ version | trim_start_matches(pat="v") }} ({{ timestamp | date(format="%Y-%m-%d") }})
{% else %}\
    ## Unreleased Changes
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim | upper_first }}
    {% for commit in commits %}
        - {% if commit.scope %}**({{ commit.scope }})** {% endif %}\
            {% if commit.breaking %}[**BREAKING**] {% endif %}\
            {{ commit.message | upper_first }} ([`{{ commit.id | truncate(length=7, end="") }}`]({{ self::remote_url() }}/commit/{{ commit.id }}))\
    {% endfor %}
{% endfor %}

{% if version %}\
    {% if previous.version %}\
        **Full Changelog**: {{ self::remote_url() }}/compare/{{ previous.version }}...{{ version }}
    {% endif %}\
{% endif %}\
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = false
split_commits = false
protect_breaking_commits = true
filter_commits = false
tag_pattern = "^v[0-9].*"
topo_order = false
sort_commits = "oldest"

commit_parsers = [
    { message = "^Merge ", skip = true },
    { message = "^feat", group = "<!-- 0 -->🚀 Features" },
    { message = "^fix", group = "<!-- 1 -->🐛 Bug Fixes" },
    { message = "^refactor", group = "<!-- 2 -->🔨 Architecture & Refactoring" },
    { message = "^perf", group = "<!-- 3 -->⚡ Performance" },
    { message = "^security", group = "<!-- 4 -->🔒 Security" },
    { message = "^docs", group = "<!-- 5 -->📚 Documentation" },
    { message = "^test", group = "<!-- 6 -->🧪 Testing" },
    { message = "^(build|ci|chore)", group = "<!-- 7 -->⚙️ CI/CD & Maintenance" },
    { body = ".*", group = "<!-- 8 -->📦 Other Changes" },
]
