name: CI — E2E Bruno Tests & OpenAPI Validation

on:
  push:
    branches:
      - main
      - master
      - "feature/**"
      - "feat/**"
      - "fix/**"
      - "refactor/**"
  pull_request:
    branches:
      - main
      - master

jobs:
  test-and-validate:
    name: Run Bruno E2E Suite & OpenAPI Check
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Set up Node.js 22 (for Bruno CLI)
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Python dependencies & Bruno CLI
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          npm install -g @usebruno/cli

      - name: Validate OpenAPI 3.1 schema generation
        run: |
          litestar --app app.main:app schema openapi

      - name: Start Litestar API server & execute Bruno E2E test suite
        run: |
          rm -f data/*.db
          uvicorn app.main:app --host 127.0.0.1 --port 8000 &
          SERVER_PID=$!

          echo "Waiting for API server readiness..."
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/api >/dev/null; then
              echo "Server is up!"
              break
            fi
            sleep 1
          done

          cd bruno
          bru run --env local

          kill $SERVER_PID || true
