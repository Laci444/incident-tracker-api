[project]
name = "incident-release-api"
version = "1.0.0"
description = "RESTful Incident & Release Management API built with Litestar"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "litestar[standard]>=2.12.0",
    "sqlalchemy[asyncio]>=2.0.35",
    "aiosqlite>=0.20.0",
    "dicttoxml2>=2.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
